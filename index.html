<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}button,input{font:inherit}button{touch-action:manipulation}.hidden{display:none!important}#landscapeShell{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:var(--bg)}@media(orientation:portrait){#landscapeShell{width:100dvh;height:100dvw;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}}
.sourceScreen{position:absolute;inset:0;display:grid;place-items:center;padding:18px}.sourceBox{width:min(760px,92%);display:grid;grid-template-columns:auto minmax(260px,1fr);gap:12px;align-items:center}.fileBtn,.btn,.speedPreset,.dockBtn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;white-space:nowrap}.fileBtn.primary,.btn.primary,.dockBtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.green{background:var(--greenSoft);border-color:#b8e4c4;color:#086b31}.btn.red{background:var(--redSoft);border-color:#efbcbc;color:#9b2525}.btn.soft{background:#f8fafc}.fileBtn:active,.btn:active,.speedPreset:active,.dockBtn:active{transform:scale(.985)}.btn:disabled{opacity:.4;cursor:default}.sourceBox .fileBtn,.sourceBox .ytInput{height:52px;border-radius:14px;font-size:14px}.sourceBox .fileBtn{padding:0 18px}#videoInput{display:none}.ytInput{width:100%;border:1px solid var(--line);padding:0 14px;background:#fff;color:var(--text);outline:none}.ytInput:focus{border-color:#91b4ff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}.sourceHint{grid-column:1/-1;min-height:16px;text-align:center;font-size:11px;color:var(--muted)}
.workspace{position:absolute;inset:0;display:flex;overflow:hidden;background:var(--bg);padding-bottom:var(--dockH)}.videoRegion{width:100%;height:100%;padding:8px 8px 7px max(8px,env(safe-area-inset-left));min-width:0;transition:width .22s ease}.workspace.drawerOpen .videoRegion{width:30%}.videoPane{width:100%;height:100%;min-width:0}.playerFrame{position:relative;width:100%;height:100%;border:1px solid #ccd5df;border-radius:13px;background:#101318;overflow:hidden;box-shadow:var(--shadow);display:grid;place-items:center}.playerFrame video,.playerFrame iframe{width:100%;height:100%;display:block;border:0;object-fit:contain;background:#101318}#youtubeMount{position:absolute;inset:0;display:none}
.drawer{width:0;height:100%;min-width:0;overflow:hidden;background:var(--panel);border-left:0 solid var(--line);transition:width .22s ease,border-width .22s ease}.workspace.drawerOpen .drawer{width:var(--drawerW);border-left-width:1px}.drawerInner{width:100%;height:100%;min-width:0;padding:8px max(10px,env(safe-area-inset-right)) 8px 10px;display:grid;grid-template-rows:26px 76px minmax(0,1fr) 62px;gap:7px;overflow:hidden}.drawerHead{display:flex;align-items:center}.drawerTitle{font-size:13px;font-weight:900}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);min-width:0;min-height:0}.cardTitle{font-size:11px;font-weight:900;color:#394456}.timelineCard{padding:8px 11px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:2px}.timelineTop{display:flex;align-items:center}.timelineWrap{position:relative;width:100%;padding-top:9px;align-self:end}#timeline{width:100%;height:31px;margin:0;accent-color:var(--blue)}.marker{position:absolute;top:9px;width:3px;height:26px;transform:translateX(-50%);border-radius:2px;pointer-events:none;opacity:0}.marker.start{background:var(--green)}.marker.end{background:var(--red)}.markerLabel{position:absolute;top:0;transform:translateX(-50%);font-size:8px;font-weight:900;pointer-events:none;opacity:0}.markerLabel.start{color:var(--green)}.markerLabel.end{color:var(--red)}
.mainArea{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:7px;min-height:0}.pointsCard{padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.pointBlock{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:7px;padding:2px}.pointHeader{display:flex;align-items:center;justify-content:space-between;gap:8px}.pointName{font-size:12px;font-weight:900}.pointState{font-size:9px;font-weight:800;color:var(--muted)}.pointActions{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(42px,1fr) 36px;gap:6px;align-self:stretch}.pointActions .btn{min-height:0;padding:0 7px;font-size:10px}.pointActions .setNow{grid-column:1/-1;font-size:11px}.loopCard{padding:9px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:7px}.loopButtons{display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:7px;min-height:0}.loopButtons .btn{height:auto;min-height:0;padding:0 8px;font-size:11px}.loopSmall{font-size:8px;color:var(--muted);line-height:1.25}
.speedCard{padding:7px 10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;min-width:0}.speedHeading{display:flex;align-items:baseline;gap:7px;white-space:nowrap}.speedHeading .cardTitle{font-size:11px}.speedValue{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}.speedNote{font-size:8px;color:var(--muted)}.speedPresets{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;min-width:0}.speedPreset{height:36px;min-width:0;padding:0 5px;font-size:10px}.speedPreset.active{background:var(--blueSoft);border-color:#92b4ff;color:#1748b2}.speedFine{display:grid;grid-template-columns:1fr 1fr;gap:5px}.speedFine .btn{height:36px;padding:0 12px;font-size:10px}
.bottomDock{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:6px;height:46px;display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:40}.dockBtn{height:46px;font-size:13px;font-weight:900;box-shadow:var(--shadow)}.drawerToggle{background:var(--blueSoft);border-color:#9dbbff;color:#1748b2}.workspace.drawerOpen .drawerToggle{background:#fff;border-color:#c7d5ee;color:#31415f}.toast{position:fixed;left:50%;bottom:calc(var(--dockH) + 8px);transform:translateX(-50%);z-index:50;background:#17202b;color:#fff;border-radius:10px;padding:8px 11px;font-size:10px;font-weight:750;opacity:0;pointer-events:none;transition:opacity .15s}.toast.show{opacity:1}.warn{position:absolute;left:12px;right:12px;bottom:calc(var(--dockH) + 8px);z-index:45;color:#875500;background:#fff6dc;border:1px solid #ead393;border-radius:10px;padding:7px 10px;font-size:9px;display:none}.warn.show{display:block}
@media(max-height:380px){:root{--dockH:52px}.videoRegion{padding-top:6px;padding-bottom:5px}.drawerInner{padding-top:6px;padding-bottom:6px;grid-template-rows:22px 65px minmax(0,1fr) 54px;gap:5px}.timelineCard,.pointsCard,.loopCard{padding:6px}.mainArea{gap:5px}.pointsCard{gap:5px}.pointActions{grid-template-rows:minmax(34px,1fr) 30px;gap:4px}.pointActions .btn,.loopButtons .btn{font-size:9px}.speedCard{padding:5px 7px;gap:6px}.speedPreset,.speedFine .btn{height:30px}.bottomDock,.dockBtn{height:40px}}
</style>
</head>
<body>
<div id="landscapeShell">

<section class="workspace hidden" id="workspace">

</div></aside>

</section><div class="warn" id="storageWarning"></div><div class="toast" id="toast"></div></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
(()=>{const $=id=>document.getElementById(id),sourceScreen=$('sourceScreen'),workspace=$('workspace'),localVideo=$('localVideo'),youtubeMount=$('youtubeMount'),input=$('videoInput'),timeline=$('timeline'),sourceHint=$('sourceHint');const STATE_KEY='pianoLoopPractice.v6.state',OLD_KEYS=['pianoLoopPractice.v5.state','pianoLoopPractice.v4.state','pianoLoopPractice.v3.state','pianoLoopPractice.v2.state'],DB_NAME='pianoLoopPractice.v2.db',DB_STORE='media';let sourceType=null,ytPlayer=null,ytApiReady=false,ytPlayerReady=false,pendingYoutubeId=null,objectUrl=null,duration=0,playing=false,loopingNow=false,speed=1,saveTimer=null,restorePosition=0,lastAutoYoutubeId=null,youtubeInputTimer=null,drawerOpen=false,loopStart=null,loopEnd=null;
function clamp(v,min,max){return Math.min(max,Math.max(min,v))}function currentTime(){if(sourceType==='youtube'&&ytPlayerReady&&ytPlayer)return Number(ytPlayer.getCurrentTime())||0;return Number(localVideo.currentTime)||0}function isReady(){return sourceType==='local'?Number.isFinite(localVideo.duration)&&localVideo.duration>0:sourceType==='youtube'&&ytPlayerReady&&duration>0}function hasStart(){return typeof loopStart==='number'&&Number.isFinite(loopStart)}function hasEnd(){return typeof loopEnd==='number'&&Number.isFinite(loopEnd)}function hasLoop(){return hasStart()&&hasEnd()&&loopEnd>loopStart}function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),900)}function warn(msg){const el=$('storageWarning');if(msg){el.textContent=msg;el.classList.add('show')}else el.classList.remove('show')}function showWorkspace(){sourceScreen.classList.add('hidden');workspace.classList.remove('hidden');setDrawer(drawerOpen)}function showLocal(){showWorkspace();localVideo.style.display='block';youtubeMount.style.display='none'}function showYoutube(){showWorkspace();localVideo.style.display='none';youtubeMount.style.display='block'}function setDrawer(open){drawerOpen=!!open;workspace.classList.toggle('drawerOpen',drawerOpen);$('drawerToggle').textContent=drawerOpen?'操作UIを閉じる':'操作UI';saveStateSoon()}
function renderAll(){$('startState').textContent=hasStart()?'設定済み':'未設定';$('endState').textContent=hasEnd()?'設定済み':'未設定';$('speedText').textContent=speed.toFixed(2)+'×';document.querySelectorAll('.speedPreset').forEach(b=>b.classList.toggle('active',Math.abs(Number(b.dataset.speed)-speed)<.001));document.querySelectorAll('[data-adjust="start"]').forEach(b=>b.disabled=!hasStart());document.querySelectorAll('[data-adjust="end"]').forEach(b=>b.disabled=!hasEnd());$('setEndBtn').disabled=!hasStart();$('restartLoopBtn').disabled=!hasStart();$('clearLoopBtn').disabled=!hasStart()&&!hasEnd();updateTimelineUI()}
function updateTimelineUI(){const now=currentTime(),denom=Math.max(duration,1);timeline.max=Math.max(duration,1);timeline.value=clamp(now,0,Math.max(duration,1));const startVisible=hasStart(),endVisible=hasEnd(),sPct=startVisible?clamp(loopStart/denom*100,0,100):0,ePct=endVisible?clamp(loopEnd/denom*100,0,100):100;$('startMarker').style.left=sPct+'%';$('startMarkerLabel').style.left=sPct+'%';$('endMarker').style.left=ePct+'%';$('endMarkerLabel').style.left=ePct+'%';$('startMarker').style.opacity=startVisible?1:0;$('startMarkerLabel').style.opacity=startVisible?1:0;$('endMarker').style.opacity=endVisible?1:0;$('endMarkerLabel').style.opacity=endVisible?1:0}
function seek(sec){sec=clamp(sec,0,Math.max(duration,0));if(sourceType==='youtube'&&ytPlayerReady&&ytPlayer)ytPlayer.seekTo(sec,true);else if(sourceType==='local')localVideo.currentTime=sec;updateTimelineUI()}function play(){if(!isReady())return;sourceType==='youtube'?ytPlayer.playVideo():localVideo.play()}function pause(){if(sourceType==='youtube'&&ytPlayerReady&&ytPlayer)ytPlayer.pauseVideo();else localVideo.pause()}function applySpeed(requested,notify=true){requested=clamp(Math.round(requested*10)/10,.25,3);speed=requested;if(sourceType==='youtube'&&ytPlayerReady&&ytPlayer){const available=ytPlayer.getAvailablePlaybackRates&&ytPlayer.getAvailablePlaybackRates()||[1];let best=available[0]||1;for(const r of available)if(Math.abs(r-requested)<Math.abs(best-requested))best=r;ytPlayer.setPlaybackRate(best);speed=best;$('speedNote').textContent='YouTube';if(notify&&Math.abs(best-requested)>.001)toast(`${requested.toFixed(1)}× → ${best}×`)}else{localVideo.playbackRate=speed;$('speedNote').textContent='0.1刻み'}renderAll();saveStateSoon()}
function validateLoop(){if(!hasStart()){loopStart=null;loopEnd=null;return}loopStart=clamp(loopStart,0,Math.max(duration,0));if(hasEnd()){loopEnd=clamp(loopEnd,0,Math.max(duration,0));if(loopEnd<=loopStart)loopEnd=null}}function resetLoop(){loopStart=null;loopEnd=null;loopingNow=false;renderAll()}function setStart(){if(!isReady())return;loopStart=currentTime();if(hasEnd()&&loopEnd<=loopStart)loopEnd=null;renderAll();saveStateSoon();toast('始点を設定')}function setEnd(){if(!isReady())return;if(!hasStart())return toast('先に始点を設定してください');const t=currentTime();if(t<=loopStart)return toast('終点は始点より後にしてください');loopEnd=t;renderAll();saveStateSoon();toast('終点を設定')}function adjust(which,delta){if(!isReady())return;if(which==='start'){if(!hasStart())return toast('始点が未設定です');loopStart=clamp(loopStart+delta,0,Math.max(0,(hasEnd()?loopEnd:duration)-.1))}else{if(!hasEnd())return toast('終点が未設定です');loopEnd=clamp(loopEnd+delta,loopStart+.1,duration)}renderAll();saveStateSoon()}function restartFromStart(){if(!isReady())return;if(!hasStart())return toast('始点が未設定です');seek(loopStart);play();toast('始点から再生')}function clearLoop(){resetLoop();saveStateSoon();toast('ループ解除')}function loopTick(){if(isReady()&&playing&&hasLoop()&&!loopingNow&&currentTime()>=loopEnd-.035){loopingNow=true;seek(loopStart);setTimeout(()=>loopingNow=false,80)}if(isReady())updateTimelineUI();requestAnimationFrame(loopTick)}
function extractYoutubeId(raw){try{const u=new URL(raw.trim()),host=u.hostname.replace(/^www\./,'');if(host==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||null;if(host==='youtube.com'||host==='m.youtube.com'||host==='music.youtube.com'){if(u.pathname==='/watch')return u.searchParams.get('v');const parts=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(parts[0]))return parts[1]||null}}catch{}const m=raw.trim().match(/^[A-Za-z0-9_-]{11}$/);return m?m[0]:null}function loadYoutube(raw,fromRestore=false){const id=extractYoutubeId(raw);if(!id)return false;if(!fromRestore)resetLoop();lastAutoYoutubeId=id;sourceType='youtube';pendingYoutubeId=id;$('youtubeUrl').value=raw;localVideo.pause();if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}showYoutube();if(ytApiReady)createOrLoadYoutube(id,fromRestore);saveStateSoon();return true}function createOrLoadYoutube(id,fromRestore=false){if(!window.YT||!YT.Player)return;if(ytPlayer){ytPlayer.loadVideoById({videoId:id,startSeconds:fromRestore?restorePosition:0});return}ytPlayer=new YT.Player('youtubePlayer',{width:'100%',height:'100%',videoId:id,playerVars:{playsinline:1,rel:0,controls:1,fs:1},events:{onReady:()=>{ytPlayerReady=true;sourceType='youtube';duration=Number(ytPlayer.getDuration())||0;if(fromRestore&&restorePosition>0)ytPlayer.seekTo(clamp(restorePosition,0,duration),true);validateLoop();applySpeed(speed,false);renderAll();saveStateSoon()},onStateChange:e=>{playing=e.data===YT.PlayerState.PLAYING;$('playBtn').textContent=playing?'⏸ 一時停止':'▶ 再生';if(playing){duration=Number(ytPlayer.getDuration())||duration;applySpeed(speed,false)}saveStateSoon()},onPlaybackRateChange:e=>{speed=Number(e.data)||speed;renderAll()},onError:()=>toast('このYouTube動画は再生できません')}})}window.onYouTubeIframeAPIReady=()=>{ytApiReady=true;if(pendingYoutubeId)createOrLoadYoutube(pendingYoutubeId,restorePosition>0)};
async function loadLocalFile(file,fromRestore=false){if(!file)return;if(!fromRestore)resetLoop();lastAutoYoutubeId=null;sourceType='local';pendingYoutubeId=null;if(ytPlayer&&ytPlayerReady)ytPlayer.pauseVideo();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(file);localVideo.onloadedmetadata=()=>{duration=Number(localVideo.duration)||0;if(fromRestore&&restorePosition>0)localVideo.currentTime=clamp(restorePosition,0,duration);validateLoop();applySpeed(speed,false);renderAll();saveStateSoon()};localVideo.src=objectUrl;showLocal();if(!fromRestore){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});await dbPut('localFile',file);warn('')}catch{warn('動画本体は保存できませんでした。次回は動画ファイルの再選択が必要です。')}}saveStateSoon()}function autoLoadYoutube(){const raw=$('youtubeUrl').value.trim(),id=extractYoutubeId(raw);if(!id){sourceHint.textContent=raw?'YouTubeのURLを貼り付けてください':'';return}if(id===lastAutoYoutubeId&&sourceType==='youtube')return;sourceHint.textContent='';loadYoutube(raw,false)}
localVideo.addEventListener('play',()=>{playing=true;$('playBtn').textContent='⏸ 一時停止'});localVideo.addEventListener('pause',()=>{playing=false;$('playBtn').textContent='▶ 再生';saveStateSoon()});localVideo.addEventListener('ended',()=>{playing=false;$('playBtn').textContent='▶ 再生'});input.addEventListener('change',()=>{const f=input.files&&input.files[0];if(f)loadLocalFile(f,false);input.value=''});$('youtubeUrl').addEventListener('paste',()=>{clearTimeout(youtubeInputTimer);youtubeInputTimer=setTimeout(autoLoadYoutube,0)});$('youtubeUrl').addEventListener('input',()=>{clearTimeout(youtubeInputTimer);youtubeInputTimer=setTimeout(autoLoadYoutube,420)});$('youtubeUrl').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();autoLoadYoutube()}});$('drawerToggle').addEventListener('click',()=>setDrawer(!drawerOpen));$('playBtn').addEventListener('click',()=>playing?pause():play());$('setStartBtn').addEventListener('click',setStart);$('setEndBtn').addEventListener('click',setEnd);$('restartLoopBtn').addEventListener('click',restartFromStart);$('clearLoopBtn').addEventListener('click',clearLoop);document.querySelectorAll('[data-adjust]').forEach(b=>b.addEventListener('click',()=>adjust(b.dataset.adjust,Number(b.dataset.delta))));timeline.addEventListener('input',()=>seek(Number(timeline.value)));$('speedMinusBtn').addEventListener('click',()=>applySpeed(speed-.1));$('speedPlusBtn').addEventListener('click',()=>applySpeed(speed+.1));document.querySelectorAll('.speedPreset').forEach(b=>b.addEventListener('click',()=>applySpeed(Number(b.dataset.speed))));
function serializeState(){return{sourceType,youtubeUrl:$('youtubeUrl').value,loopStart,loopEnd,speed,position:currentTime(),drawerOpen,savedAt:Date.now()}}function saveStateSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(STATE_KEY,JSON.stringify(serializeState()))}catch{}},180)}function loadState(){try{let s=JSON.parse(localStorage.getItem(STATE_KEY)||'null'),migrated=false;if(!s){for(const k of OLD_KEYS){const raw=localStorage.getItem(k);if(raw){const old=JSON.parse(raw);if(old){s=old;migrated=true;break}}}}if(!s)return null;if(!migrated){loopStart=(typeof s.loopStart==='number'&&Number.isFinite(s.loopStart))?s.loopStart:null;loopEnd=(typeof s.loopEnd==='number'&&Number.isFinite(s.loopEnd))?s.loopEnd:null}else{loopStart=null;loopEnd=null}speed=Number(s.speed)||1;restorePosition=Number(s.position)||0;drawerOpen=!!s.drawerOpen;if(s.youtubeUrl)$('youtubeUrl').value=s.youtubeUrl;return s}catch{return null}}function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(DB_STORE))req.result.createObjectStore(DB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function dbPut(key,val){const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(val,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}async function dbGet(key){const db=await openDb(),val=await new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readonly'),r=tx.objectStore(DB_STORE).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});db.close();return val}async function restore(){const s=loadState();renderAll();if(!s)return;if(s.sourceType==='youtube'&&s.youtubeUrl){loadYoutube(s.youtubeUrl,true);setDrawer(drawerOpen)}else if(s.sourceType==='local'){try{const file=await dbGet('localFile');if(file){await loadLocalFile(file,true);setDrawer(drawerOpen)}}catch{}}}window.addEventListener('pagehide',()=>{try{localStorage.setItem(STATE_KEY,JSON.stringify(serializeState()))}catch{}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveStateSoon()});renderAll();restore();requestAnimationFrame(loopTick)})();
