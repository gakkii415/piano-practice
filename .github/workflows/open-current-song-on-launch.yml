name: Open current piano song on launch

on:
  push:
    paths:
      - '.github/workflows/open-current-song-on-launch.yml'

permissions:
  contents: write

jobs:
  update-launch-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open current song immediately
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "async function restore(){const s=loadState();renderAll();if(!s)return;if(s.sourceType==='youtube'&&s.youtubeUrl){loadYoutube(s.youtubeUrl,true);setDrawer(drawerOpen)}else if(s.sourceType==='local'){try{const file=await dbGet('localFile');if(file){await loadLocalFile(file,true);setDrawer(drawerOpen)}}catch{}}}"
          new = "async function restore(){const s=loadState();renderAll();const defaultUrl=$('youtubeUrl').value;if(s&&s.sourceType==='youtube'&&s.youtubeUrl){loadYoutube(s.youtubeUrl,true);setDrawer(drawerOpen);return}restorePosition=0;loopStart=null;loopEnd=null;loadYoutube(defaultUrl,false);setDrawer(drawerOpen)}"
          if old not in text:
              if new in text:
                  print('Already updated')
              else:
                  raise SystemExit('Target restore function was not found')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit change
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Open current piano song on launch"
          git push
